<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mermaid2Pptx sample</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; }
    .slide {
      width: 1280px;
      height: 720px;
      display: grid;
      place-items: center;
      background: white;
    }
    .mermaid { width: 900px; }
  </style>
</head>
<body>
  <section class="slide">
    <pre class="mermaid">
flowchart LR
  A([Start]) --> B{Decision}
  B -- Yes --> C[Native PowerPoint shapes]
  B -- No --> D[Warning report]
  C --> E([Done])
  D --> E
    </pre>
  </section>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });
    await mermaid.run({ querySelector: ".mermaid" });
    window.__MERMAID_DONE__ = true;
  </script>
</body>
</html>
